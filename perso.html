<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramassage</title>
    <style>
        body {
            margin: 0;
            min-height: 350px;
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            background-image: url(image2/poubelle5.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            height: auto;

        }

        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 1;
        }

        h3 {
            font-size: 30px;
            color: #ffffff;
            margin: 0;
            text-align: center;
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        p {
            font-size: 1.2em;
            color: #ffffff;
            margin: 0;
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            text-align: center;
        }
    </style>
</head>
<body>
    <h3>Plus d'ordure qui trainent</h3>
    <br>
    <p>"Ne laissez plus les déchets gacher votre quotidien.<br>
        En un clic, trouvez un ramasseur proche de chez vous"</p>
</body>
</html>
